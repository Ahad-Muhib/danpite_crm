<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Your Email — Danpite CRM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="login-wrapper">
  <div class="login-card text-center">
    <div class="mb-3">
      <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-success-subtle text-success p-3" style="width: 72px; height: 72px;">
        <i class="bi bi-envelope-check" style="font-size: 36px;"></i>
      </div>
    </div>
    <h4 class="fw-bold mb-2">Check Your Email</h4>
    <p class="text-muted" style="font-size:13.5px; line-height: 1.6;">
      If the email you entered matches an active account in our system, we've sent instructions to reset your password.<br>
      Please check your inbox (and spam folder).
    </p>
    <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2 fw-medium mt-3">
      <i class="bi bi-box-arrow-in-right me-1"></i> Return to Sign In
    </a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

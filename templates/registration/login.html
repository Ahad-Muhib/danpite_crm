<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Danpite CRM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="mb-2" id="login-logo-area" style="cursor:pointer;">
        <img src="{% if site_settings.logo_image %}{{ site_settings.logo_image.url }}{% else %}{{ MEDIA_URL }}invoice_logos/danpite-ezgif.com-webp-to-jpg-converter.jpg{% endif %}" alt="Logo" style="max-height:60px;width:auto;border-radius:6px;">
      </div>
      <h4 class="fw-bold mb-0">Danpite CRM</h4>
      <p class="text-muted mt-1" style="font-size:13px;">Sign in to your account</p>
    </div>

    {% if form.errors %}
    <div class="alert alert-danger py-2" style="font-size:13px;">
      <i class="bi bi-exclamation-circle me-1"></i> Invalid username or password.
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-medium">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
          <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="Enter username" autofocus required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-medium">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
          <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="Enter password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>
    </form>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% if request.user.is_authenticated and request.user.is_superuser %}
<div class="modal fade" id="logoSettingsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <form method="post" action="{% url 'update_site_settings' %}" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="modal-header"><h6 class="modal-title"><i class="bi bi-image me-2"></i>Upload Logo</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label fw-medium">Logo Image</label><input type="file" name="logo_image" class="form-control" accept="image/*" required></div>
          <div class="text-muted small">Recommended size: 200x60px. PNG or JPEG.</div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-upload me-1"></i>Upload</button></div>
      </form>
    </div>
  </div>
</div>
<script>
document.getElementById('login-logo-area')?.addEventListener('click', function() {
  var modal = new bootstrap.Modal(document.getElementById('logoSettingsModal'));
  modal.show();
});
</script>
{% endif %}
</body>
</html>

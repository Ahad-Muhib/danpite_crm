<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Danpite CRM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="mb-2">
        <img src="{% if site_settings.logo_image %}{{ site_settings.logo_image.url }}{% else %}{{ MEDIA_URL }}invoice_logos/danpite-ezgif.com-webp-to-jpg-converter.jpg{% endif %}" alt="Logo" style="max-height:60px;width:auto;border-radius:6px;">
      </div>
      <h4 class="fw-bold mb-0">Reset Password</h4>
      <p class="text-muted mt-1" style="font-size:13px;">Enter your registered email address or username to receive a secure recovery link</p>
    </div>

    {% if form.errors %}
    <div class="alert alert-danger py-2" style="font-size:13px;">
      <i class="bi bi-exclamation-circle me-1"></i> Please enter a valid registered email address or username.
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label class="form-label fw-medium">Email or Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-badge text-muted"></i></span>
          <input type="text" name="email" class="form-control border-start-0 ps-0" placeholder="Enter your email or username" autofocus required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">
        <i class="bi bi-send me-1"></i> Send Recovery Link
      </button>
    </form>
    <div class="text-center mt-3">
      <a href="{% url 'login' %}" style="font-size:13px; text-decoration:none; color:#6b7280;">
        <i class="bi bi-arrow-left me-1"></i> Back to Login
      </a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

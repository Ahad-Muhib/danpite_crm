{% extends "base.html" %}
{% load static %}

{% block title %}403 - Permission Denied | Danpite CRM{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center text-center my-5">
    <div class="col-lg-6 col-md-8">
      <div class="card crm-card p-5 border-0 shadow-sm" style="background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08);">
        <div class="mb-4">
          <span class="badge rounded-pill bg-warning bg-opacity-25 text-warning px-3 py-2 fs-6">
            <i class="bi bi-shield-lock-fill me-1"></i> Error 403
          </span>
        </div>
        <h1 class="display-4 fw-bold text-white mb-3">Access Denied</h1>
        <p class="text-secondary mb-4 fs-6">
          You do not have the required permissions or role to access this module or perform this action.
        </p>
        <div class="d-flex justify-content-center gap-3">
          <a href="{% url 'dashboard' %}" class="btn btn-primary px-4 py-2 fw-semibold">
            <i class="bi bi-grid-1x2-fill me-2"></i> Go to Dashboard
          </a>
          <button onclick="window.history.back()" class="btn btn-outline-secondary px-4 py-2">
            <i class="bi bi-arrow-left me-2"></i> Go Back
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

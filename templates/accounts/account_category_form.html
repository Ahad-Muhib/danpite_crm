{% extends 'base.html' %}
{% block title %}{{ action|default:"Add" }} Account Category{% endblock %}
{% block page_title %}{{ action|default:"Add" }} Account Category{% endblock %}
{% block content %}
<div class="crm-card">
  <div class="crm-card-header"><span class="crm-card-title">Category Details</span></div>
  <div class="p-4">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-medium">Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" placeholder="Category name..." value="{{ category.name|default:'' }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-medium">Type <span class="text-danger">*</span></label>
          <select name="account_type" class="form-select" required>
            <option value="">-- Select Type --</option>
            <option value="bank" {% if category.account_type == 'bank' %}selected{% endif %}>Bank</option>
            <option value="mobile" {% if category.account_type == 'mobile' %}selected{% endif %}>Mobile Banking</option>
            <option value="cash" {% if category.account_type == 'cash' %}selected{% endif %}>Cash</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-medium">Status</label>
          <select name="is_active" class="form-select">
            <option value="1" {% if category.is_active or not category %}selected{% endif %}>Active</option>
            <option value="0" {% if category and not category.is_active %}selected{% endif %}>Inactive</option>
          </select>
        </div>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">{% if action == 'Add' %}Create{% else %}Update{% endif %} Category</button>
        <a href="{% url 'account_category_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

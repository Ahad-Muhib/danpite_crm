<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - Server Error | Danpite CRM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 10% 20%, rgb(18, 24, 38) 0%, rgb(10, 14, 23) 90%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .error-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 580px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <div class="error-card p-5 text-center">
    <div class="mb-4">
      <span class="badge rounded-pill bg-danger bg-opacity-25 text-danger px-3 py-2 fs-6">
        <i class="bi bi-x-octagon-fill me-1"></i> Error 500
      </span>
    </div>
    <h1 class="display-4 fw-bold text-white mb-3">Internal Server Error</h1>
    <p class="text-secondary mb-4 fs-6">
      Something unexpected occurred on our end. The issue has been recorded in the server logs and will be investigated.
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="/" class="btn btn-primary px-4 py-2 fw-semibold">
        <i class="bi bi-arrow-clockwise me-2"></i> Reload CRM
      </a>
      <button onclick="window.history.back()" class="btn btn-outline-secondary px-4 py-2">
        <i class="bi bi-arrow-left me-2"></i> Go Back
      </button>
    </div>
  </div>
</body>
</html>

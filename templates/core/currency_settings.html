{% extends 'base.html' %}
{% block title %}Currency Settings{% endblock %}
{% block page_title %}Currency Settings{% endblock %}
{% block content %}
<div class="crm-card" style="max-width:480px;">
  <div class="crm-card-header"><span class="crm-card-title">Currency Settings</span></div>
  <div class="p-4">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-medium">Select Currency</label>
        {{ form.currency_code }}
        <div class="form-text">This currency will be used across all invoices, payments, and expenses.</div>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">Save Settings</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
